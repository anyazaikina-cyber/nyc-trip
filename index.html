<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NYC trip">
<title>NYC Trip</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f24; --muted:#6b6f78; --line:#e4e0d6;
  --accent:#d9480f; --accent-soft:#fff0e8; --nav:#1f2a44; --nav-ink:#ffffff; --done:#9aa0a8;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14161b; --card:#1d2027; --ink:#eceae4; --muted:#9a9ea8; --line:#2c303a;
    --accent:#ff8a50; --accent-soft:#2b211c; --nav:#0f1320; --done:#5f646d;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
header{background:var(--nav);color:var(--nav-ink);padding:calc(14px + env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header p{margin:2px 0 10px;font-size:13px;opacity:.75}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;
  background:rgba(255,255,255,.12);color:var(--nav-ink);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--accent);color:#fff;font-weight:600}
nav button .today{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7CFC9A;margin-left:6px;vertical-align:middle}
main{padding:14px 16px calc(40px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.dayhead h2{margin:4px 0 2px;font-size:22px}
.dayhead .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.tip{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:14px;margin:0 0 14px}
section{margin:0 0 18px}
section h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.item input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}
.item .body{flex:1;min-width:0}
.item .name{font-weight:600}
.item .time{color:var(--accent);font-weight:600;font-size:13px;margin-right:6px}
.item .note{color:var(--muted);font-size:14px;margin-top:2px}
.item.done .name,.item.done .note{color:var(--done);text-decoration:line-through}
.item .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.map{flex:0 0 auto;align-self:center;text-decoration:none;font-size:13px;font-weight:600;color:var(--accent);
  border:1px solid var(--accent);border-radius:999px;padding:5px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h4{margin:0 0 6px;font-size:16px}
.card p,.card li{font-size:14px;margin:4px 0}
.card ul{padding-left:18px;margin:4px 0}
.card a{color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-block;text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:10px;background:var(--accent);color:#fff}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.progress{font-size:13px;color:var(--muted);margin:-6px 0 12px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:10px 16px 30px}
</style>
</head>
<body>
<header>
  <h1>New York, 5–11 Nov</h1>
  <p id="countdown">Astoria base · wedding on Fri 6</p>
  <nav id="tabs" role="tablist"></nav>

<main id="view"></main>
<footer>Ticks are saved on this phone only. Check opening hours for small shops before you go.</footer>

const DAYS = [

 {id:"d11", date:"2026-11-11", tab:"Wed 11", title:"Fly home", sub:"JFK · 17:35 · be at the airport by 14:30",
  tip:"Pack the night before. Ask the front desk to hold your bags after check-out.",
  sections:[

const INFO = `
<div class="dayhead"><h2>Trip essentials</h2><div class="sub">Hotel, bookings and practical tips</div></div>
<div class="card"><h4>🏨 voco Astoria</h4>
 <p>30-17 31st Street, Astoria, NY 11102<br>Check-in 16:00 · check-out 11:00<br>Next to 30 Av station (N/W)</p>
 <div class="btnrow"><a class="btn alt" href="${M('voco Astoria, 30-17 31st Street, Astoria, NY 11102')}" target="_blank" rel="noopener">Map</a></div></div>
<div class="card"><h4>🩺 Travel insurance (BTA)</h4>
 <p><b>24/7 assistance:</b> <a href="tel:+37126121212">+371 26 12 12 12</a> · <a href="mailto:assist@bta.lv">assist@bta.lv</a></p>
 <p><b>Policy no.</b> LV26-CN-00062492-9</p>
 <p>If you're unwell, BTA can arrange a video or phone consultation with a Latvian doctor on the same number. Ring them before going to a US clinic if you can, because they can point you somewhere they work with.</p></div>
<section><h3>Before you fly</h3><div id="prelist"></div></section>
<div class="card"><h4>🛍 Shopping list</h4><ul>
 <li><b>Most iconic:</b> Yankees cap · Yankees Clubhouse, 745 Seventh Ave (Tue evening)</li>
 <li><b>Best fashion find:</b> vintage NYC sweatshirt or T-shirt · Williamsburg vintage shops (Sat), or DUO NYC (Mon)</li>
 <li><b>Best gift:</b> MoMA design object · MoMA Design Store, 44 W 53rd St (Tue)</li>
 <li><b>Calvin Klein underwear:</b> CK flagship, 530 Broadway, SoHo (Mon). Century 21 sometimes has it cheaper (Sat).</li></ul></div>
<div class="card"><h4>🎟 What to book</h4><ul>
 <li><b>MoMA</b> (Tue): online a day or two before</li>
 <li><b>The Met</b> (Sun): online the day before, no timed slot needed</li>
 <li><b>Circle Line</b> (Sat): only if you choose it over the NYC Ferry</li>
 <li>No booking needed: library, Grand Central, parks, 9/11 plaza, ferries, shops</li></ul></div>
<div class="card"><h4>✈️ JFK transfers</h4>
 <p><b>Arriving:</b> official taxi rank, metered to Queens (about $50–70 with tip). Or AirTrain to Jamaica plus subway ($11.75, 75–90 min, stairs).</p>
 <p><b>Leaving:</b> Uber/Lyft from the hotel at about 13:00 for a 17:35 flight.</p></div>
<div class="card"><h4>🚇 Getting around</h4><ul>
 <li>Tap your contactless card at the gate. Fares cap after 12 rides in 7 days.</li>
 <li>N/W from 30 Av goes direct to 5 Av/59 St, Times Sq, Union Sq and Prince St.</li>
 <li>Check Google Maps on the day for weekend service changes.</li></ul></div>
<div class="card"><h4>💵 Money</h4><ul>
 <li>Sales tax (about 8.9%) isn't in the price on the tag.</li>
 <li>Clothing and shoes under $110 per item are tax-exempt.</li>
 <li>Tip 18–20% in restaurants, $1–2 per drink in bars.</li></ul></div>
<div class="card"><h4>🧥 Weather</h4><p>Usually 5–15°C in early November, colder on the water. Bring a warm layer for the boat.</p></div>
`;

const PRE = [
 {n:"ESTA approved", d:"Official site only: esta.cbp.dhs.gov ($40)"},
 {n:"Travel insurance bought", d:"Check missed-connection cover"},
 {n:"US eSIM set up", d:"EU roaming doesn't cover the US"},
 {n:"Plug adapter (type A/B)"}
];

// ---- storage (per phone, safe if unavailable)
const KEY = "nyc-trip-ticks-v1";
let ticks = {};
try { ticks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { ticks = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(ticks)); } catch(e) {} }

function nyDate(){
  try { return new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(new Date()); }
  catch(e){ return new Date().toISOString().slice(0,10); }
}
const todayStr = nyDate();

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function itemHTML(it, id){
  const done = !!ticks[id];
  return `<label class="item${done?" done":""}">
    <input type="checkbox" data-id="${id}"${done?" checked":""}>
    <div class="body"><div class="name">${it.t?`<span class="time">${esc(it.t)}</span>`:""}${esc(it.n)}${it.tag?`<span class="tag">${esc(it.tag)}</span>`:""}</div>
    ${it.d?`<div class="note">${esc(it.d)}</div>`:""}</div>
    ${it.q?`<a class="map" href="${M(it.q)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Map</a>`:""}
  </label>`;
}

function renderDay(day){
  let total=0, done=0, html="";
  day.sections.forEach((s,si)=>{
    html += `<section><h3>${esc(s.h)}</h3>`;
    s.items.forEach((it,ii)=>{ const id=`${day.id}-${si}-${ii}`; total++; if(ticks[id]) done++; html += itemHTML(it,id); });
    html += `</section>`;
  });
  return `<div class="dayhead"><h2>${esc(day.title)}</h2><div class="sub">${esc(day.sub||"")}</div></div>
   <div class="progress">${done} of ${total} done</div>
   ${day.tip?`<div class="tip">${esc(day.tip)}</div>`:""}${html}`;
}

function render(tabId){
  const view = document.getElementById("view");
  if(tabId==="info"){
    view.innerHTML = INFO;
    document.getElementById("prelist").innerHTML = PRE.map((it,i)=>itemHTML(it,"pre-"+i)).join("");
  } else {
    view.innerHTML = renderDay(DAYS.find(d=>d.id===tabId));
  }
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tabId));
  try { sessionStorage.setItem("nyc-tab", tabId); } catch(e) {}
  window.scrollTo(0,0);
}

document.getElementById("view").addEventListener("change", e=>{
  const id = e.target.dataset && e.target.dataset.id; if(!id) return;
  if(e.target.checked) ticks[id]=1; else delete ticks[id];
  save();
  e.target.closest(".item").classList.toggle("done", e.target.checked);
  const p = document.querySelector(".progress");
  if(p){ const boxes=[...document.querySelectorAll("#view .item input")]; p.textContent = `${boxes.filter(b=>b.checked).length} of ${boxes.length} done`; }
});

// tabs
const nav = document.getElementById("tabs");
const tabs = [{id:"info", tab:"Essentials"}, ...DAYS];
nav.innerHTML = tabs.map(t=>`<button role="tab" data-tab="${t.id}">${esc(t.tab)}${t.date===todayStr?'<span class="today"></span>':""}</button>`).join("");
nav.addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) render(b.dataset.tab); });

// countdown line
(function(){
  const start = new Date("2026-11-05T00:00:00"), now = new Date(nyDate()+"T00:00:00");
  const days = Math.round((start-now)/86400000);
  const el = document.getElementById("countdown");
  if(days>1) el.textContent = `${days} days to go · Astoria base · wedding on Fri 6`;
  else if(days===1) el.textContent = "Tomorrow! Check your ESTA and pack a warm layer";
  else if(todayStr<="2026-11-11") el.textContent = "You're in New York 🗽";
})();

// initial tab: today during the trip, else last viewed, else essentials
let start = "info";
const todayDay = DAYS.find(d=>d.date===todayStr);
if(todayDay) start = todayDay.id;
else { try { start = sessionStorage.getItem("nyc-tab") || "info"; } catch(e) {} }
render(start);
const sel = nav.querySelector(`[data-tab="${start}"]`); if(sel) sel.scrollIntoView({inline:"center", block:"nearest"});
</script>
</body>
</html>
